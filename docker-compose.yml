version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: baidu-full-page-ocr-backend
    ports:
      - "18083:18083"
    environment:
      - SERVER_PORT=18083
      - BAIDU_OCR_AUTHORIZATION=${BAIDU_OCR_AUTHORIZATION}
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY}
      - BAIDU_OCR_TIMEOUT_SECONDS=${BAIDU_OCR_TIMEOUT_SECONDS:-60}
      - BAIDU_OCR_LANGUAGE_TYPE=${BAIDU_OCR_LANGUAGE_TYPE:-CHN_ENG}
      - BAIDU_OCR_DETECT_DIRECTION=${BAIDU_OCR_DETECT_DIRECTION:-false}
      - BAIDU_OCR_VERTEXES_LOCATION=${BAIDU_OCR_VERTEXES_LOCATION:-false}
      - BAIDU_OCR_PARAGRAPH=${BAIDU_OCR_PARAGRAPH:-false}
      - BAIDU_OCR_PROBABILITY=${BAIDU_OCR_PROBABILITY:-false}
      - BAIDU_OCR_CHAR_PROBABILITY=${BAIDU_OCR_CHAR_PROBABILITY:-false}
      - BAIDU_OCR_MULTIDIRECTIONAL_RECOGNIZE=${BAIDU_OCR_MULTIDIRECTIONAL_RECOGNIZE:-false}
      - RAG_ENABLED=false
      - LLM_ENABLED=true
      - LLM_BASE_URL=${LLM_BASE_URL:-https://apie.zhisuaninfo.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-Qwen3.6-35B-A3B}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-qwen3.6-35b-a3b}
      - DASHSCOPE_ENABLE_THINKING=${DASHSCOPE_ENABLE_THINKING:-true}
      - FIELD_OCR_ENABLED=false
      - FIELD_OCR_TIMEOUT_SECONDS=${FIELD_OCR_TIMEOUT_SECONDS:-20}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: baidu-full-page-ocr-frontend
    ports:
      - "5197:80"
    depends_on:
      backend:
        condition: service_healthy
