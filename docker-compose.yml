version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: baidu-full-page-ocr-backend
    ports:
      - "18083:18083"
    environment:
      - SERVER_PORT=18083
      - RAG_ENABLED=false
      - LLM_ENABLED=true
      - LLM_BASE_URL=${LLM_BASE_URL:-https://apie.zhisuaninfo.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-Qwen3.6-35B-A3B}
      - FIELD_JUDGE_ENABLED=${FIELD_JUDGE_ENABLED:-true}
      - FIELD_JUDGE_MODE=${FIELD_JUDGE_MODE:-enforce}
      - FIELD_JUDGE_BASE_URL=${FIELD_JUDGE_BASE_URL:-https://token.zhisuaninfo.com/v1}
      - FIELD_JUDGE_API_KEY=${FIELD_JUDGE_API_KEY}
      - FIELD_JUDGE_MODEL=${FIELD_JUDGE_MODEL:-Qwen3.6-Flash}
      - FIELD_JUDGE_PASS_THRESHOLD=${FIELD_JUDGE_PASS_THRESHOLD:-80}
      - FIELD_OCR_ENABLED=true
      - FIELD_OCR_BASE_URL=http://ocr-service:18092
      - FIELD_OCR_TIMEOUT_SECONDS=${FIELD_OCR_TIMEOUT_SECONDS:-180}
    depends_on:
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    build:
      context: ./ocr-service
    container_name: field-ocr-service
    ports:
      - "18092:18092"
    volumes:
      - ./models:/models:ro
      - ./.paddlex_cache:/.paddlex_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18092/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: baidu-full-page-ocr-frontend
    ports:
      - "5197:80"
    depends_on:
      backend:
        condition: service_healthy
