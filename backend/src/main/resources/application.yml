server:
  port: ${SERVER_PORT:18081}

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:150MB}

id995a:
  template-path: ${TEMPLATE_PATH:../official_templates/students/ID995A_来港就读申请表_申请人.pdf}
  rules-path: ${RULES_PATH:../official_templates/students/ID995A_审核规则.html}

document-renderer:
  pdf-dpi: ${DOCUMENT_RENDERER_PDF_DPI:240}
  max-image-long-side: ${DOCUMENT_RENDERER_MAX_IMAGE_LONG_SIDE:0}

llm:
  enabled: ${LLM_ENABLED:true}
  base-url: ${LLM_BASE_URL:https://apie.zhisuaninfo.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:Qwen3.6-35B-A3B}
  max-tokens: ${LLM_MAX_TOKENS:8192}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:1200}
  page-concurrency: ${LLM_PAGE_CONCURRENCY:5}

field-ocr:
  enabled: ${FIELD_OCR_ENABLED:false}
  base-url: ${FIELD_OCR_BASE_URL:http://127.0.0.1:18092}
  timeout-seconds: ${FIELD_OCR_TIMEOUT_SECONDS:20}

field-judge:
  enabled: ${FIELD_JUDGE_ENABLED:false}
  mode: ${FIELD_JUDGE_MODE:shadow}
  base-url: ${FIELD_JUDGE_BASE_URL:https://token.zhisuaninfo.com/v1}
  api-key: ${FIELD_JUDGE_API_KEY:}
  model: ${FIELD_JUDGE_MODEL:Qwen3.6-Flash}
  timeout-seconds: ${FIELD_JUDGE_TIMEOUT_SECONDS:20}
  pass-threshold: ${FIELD_JUDGE_PASS_THRESHOLD:80}
  concurrency: ${FIELD_JUDGE_CONCURRENCY:4}

fdh:
  review:
    file-concurrency: ${FDH_REVIEW_FILE_CONCURRENCY:2}
    official-page-number-timeout-millis: ${FDH_OFFICIAL_PAGE_NUMBER_TIMEOUT_MILLIS:30000}

rag:
  enabled: ${RAG_ENABLED:false}
  base-url: ${RAG_BASE_URL:http://127.0.0.1:18090}
  timeout-seconds: ${RAG_TIMEOUT_SECONDS:30}
  top-k: ${RAG_TOP_K:8}
